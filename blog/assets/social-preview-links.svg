<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16273e"/>
      <stop offset="55%" stop-color="#122033"/>
      <stop offset="100%" stop-color="#0d1826"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eeae56"/>
      <stop offset="100%" stop-color="#eeae56" stop-opacity="0"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8aa8"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1085" cy="105" r="230" fill="#eeae56" opacity="0.045"/>
  <circle cx="1150" cy="560" r="150" fill="#eeae56" opacity="0.03"/>
  <rect x="0" y="0" width="1200" height="6" fill="#eeae56"/>

  <!-- kicker -->
  <text x="72" y="112" font-size="17" font-weight="700" fill="#eeae56" letter-spacing="0.16em">OPTIMIZELY SAAS CMS  ·  HEADLESS</text>

  <!-- headline -->
  <text x="72" y="196" font-size="62" font-weight="700" fill="#ffffff">Stakeholder previews are</text>
  <text x="72" y="266" font-size="62" font-weight="700" fill="#ffffff">not out of the box</text>

  <rect x="72" y="300" width="420" height="3" fill="url(#rule)"/>

  <!-- subhead -->
  <text x="72" y="352" font-size="26" fill="#b9cadd">Login-free links to unpublished content,</text>
  <text x="72" y="388" font-size="26" fill="#b9cadd">and how they actually work.</text>

  <!-- mini flow -->
  <g fill="#1b2f47" stroke="#2c4869">
    <rect x="72" y="432" width="176" height="60" rx="9"/>
    <rect x="300" y="432" width="196" height="60" rx="9"/>
    <rect x="548" y="432" width="196" height="60" rx="9"/>
  </g>
  <g font-size="18" fill="#dce7f2" text-anchor="middle">
    <text x="160" y="463">Author clicks</text>
    <text x="160" y="483">Share</text>
    <text x="398" y="463">Signed link,</text>
    <text x="398" y="483">no credentials</text>
    <text x="646" y="463">Reviewer opens,</text>
    <text x="646" y="483">no login</text>
  </g>
  <path d="M256 462 L292 462" stroke="#6f8aa8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M504 462 L540 462" stroke="#6f8aa8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- lock note -->
  <g transform="translate(790,432)">
    <rect x="0" y="0" width="338" height="60" rx="9" fill="#17301f" stroke="#2f5c3f"/>
    <path d="M26 30 a10 10 0 0 1 20 0 v6 h-6 v-6 a4 4 0 0 0 -8 0 v6 h-6 z" fill="#5fbe86"/>
    <rect x="24" y="36" width="24" height="18" rx="3" fill="#5fbe86"/>
    <text x="66" y="30" font-size="16.5" font-weight="700" fill="#8fe0ae">The key that reads drafts</text>
    <text x="66" y="50" font-size="16.5" font-weight="700" fill="#8fe0ae">never leaves your server</text>
  </g>

  <!-- footer -->
  <rect x="72" y="548" width="1056" height="1" fill="#25405e"/>
  <text x="72" y="588" font-size="19" font-weight="700" fill="#ffffff">Nikki Punjabi</text>
  <text x="196" y="588" font-size="19" fill="#7f97b0">blog.nikkipunjabi.com</text>
  <text x="1128" y="588" font-size="17" fill="#eeae56" text-anchor="end" letter-spacing="0.06em">NEW POST</text>
</svg>
